[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridge-mcp-server"
version = "0.4.0"
description = "Cross-platform intelligence bridge — correlate Ignition SCADA tags with Studio 5000 PLC logic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nodeblue", email = "contact@nodeblue.ai" }]
keywords = ["ignition", "studio5000", "rockwell", "scada", "plc", "mcp", "industrial-automation", "cross-reference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ignition-mcp-server",
    "studio5000-mcp-server",
    "fastmcp==3.2.3",
]

[project.urls]
Homepage = "https://github.com/Nodeblue-AI/bridge-mcp-server"
Repository = "https://github.com/Nodeblue-AI/bridge-mcp-server"
Issues = "https://github.com/Nodeblue-AI/bridge-mcp-server/issues"
Changelog = "https://github.com/Nodeblue-AI/bridge-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
bridge-mcp-server = "bridge_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
